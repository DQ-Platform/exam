<!DOCTYPE html>
<html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DQ Platform — Cavablar</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;color:#0b2540;min-height:100vh;background:linear-gradient(180deg,#3a9bfa 0,#7fbcfb 260px,#eef6ff 520px,#f4f9ff) fixed;padding:16px}
.w{max-width:1000px;margin:0 auto}a.b{color:#fff;font:700 11px Inter;letter-spacing:.05em;text-decoration:none}
h1{font:400 clamp(38px,9vw,70px)/.95 'Bebas Neue',Impact,sans-serif;color:#fff;text-align:center;margin:22px 0 14px;text-transform:uppercase}
.p{background:#fdfdfe;border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(8,60,130,.14)}
input{width:100%;padding:11px 12px;border:1px solid #e3ecf6;border-radius:10px;font:500 14px Inter;margin-bottom:10px;outline:none}input:focus{border-color:#0099ff}
.t{overflow:auto;max-height:70vh;border:1px solid #e3ecf6;border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#0099ff;color:#fff;text-align:left;padding:9px 10px;font:700 11px Inter;letter-spacing:.05em;text-transform:uppercase}td{padding:9px 10px;border-bottom:1px solid #f0f5fb;white-space:nowrap}
.s{display:inline-block;background:#f72103;color:#fff;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px}.sk{height:14px;margin:12px;border-radius:7px;background:#eef4fb}.e{padding:18px;color:#6b7a90;text-align:center}
</style></head><body><div class="w"><a class="b" href="admin.html">← PANEL</a><h1>Cavablar</h1>
<div class="p"><input id="q" placeholder="Ad, iş nömrəsi və ya kateqoriya üzrə axtar"><div class="t"><table><thead id="h"></thead><tbody id="b"><tr><td><div class="sk"></div></td></tr></tbody></table></div><div class="e" id="c"></div></div></div>
<script src="dq-net.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="dq-db.js"></script>
<script>
(function(){var rows=[],$=function(i){return document.getElementById(i)},E=DQ.esc;
var PREF=["student_name","fin","exam_no","category","score","created_at"],HID={id:1,answers:1,details:1};
function cols(){var s={};rows.slice(0,50).forEach(function(r){Object.keys(r).forEach(function(k){if(!HID[k]&&typeof r[k]!=="object")s[k]=1})});
var k=Object.keys(s);return PREF.filter(function(x){return s[x]}).concat(k.filter(function(x){return PREF.indexOf(x)<0}))}
function cell(k,v){if(v==null)return"";if(k==="created_at")return E(new Date(v).toLocaleString("az"));if(k==="score")return'<span class="s">'+E(v)+'</span>';return E(v)}
function draw(){var q=$("q").value.trim().toLowerCase(),c=cols(),f=rows.filter(function(r){return!q||JSON.stringify(r).toLowerCase().indexOf(q)>-1});
$("h").innerHTML="<tr>"+c.map(function(k){return"<th>"+E(k)+"</th>"}).join("")+"</tr>";
$("b").innerHTML=f.slice(0,500).map(function(r){return"<tr>"+c.map(function(k){return"<td>"+cell(k,r[k])+"</td>"}).join("")+"</tr>"}).join("");
$("c").textContent=f.length?f.length+" nəticə":"Nəticə tapılmadı."}
$("q").oninput=draw;
DQ.load("exam_results",function(q){return q.select("*").order("id",{ascending:false}).limit(500)},{key:"cavablar",every:15000,render:function(d){rows=d;draw()}});
})();
</script></body></html>

<body>
<main class="box">
 <h1>🔗 <span>Elan</span> idarəetməsi</h1>
 <p>Xəbər düymələri və linklər: Sınaq → «Qeydiyyatdan keç», DQ rəsmi elan → link, Mənbəli xəbər → «Mənbə».</p>

 <form id="f-setup" hidden autocomplete="off" novalidate>
  <p>İlk giriş: bu səhifə üçün PIN təyin edin (ən azı 6 simvol).</p>
  <label for="p1">Yeni PIN</label><input id="p1" type="password" minlength="6" autocomplete="new-password" required>
  <label for="p2">PIN təkrar</label><input id="p2" type="password" minlength="6" autocomplete="new-password" required>
  <button class="btn" type="submit">PIN-i təyin et</button>
  <div class="msg" id="m-setup" role="alert"></div>
  <div id="hashbox" hidden>
   <p>Başqa cihazlarda da eyni PIN işləsin deyə bu sətri faylda <b>PIN_HASH</b> dəyişəninə yapışdırın:</p>
   <div class="hash" id="hashval"></div>
   <button class="btn ghost" type="button" id="copyhash">Kopyala</button>
   <button class="btn" type="button" id="go1">Davam et</button>
  </div>
 </form>

 <form id="f-login" hidden autocomplete="off" novalidate>
  <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Daxil ol</button>
  <div class="msg" id="m-login" role="alert"></div>
 </form>

 <div id="panel" hidden>
  <button class="btn" type="button" id="open">Xəbər linklərini aç</button>
  <button class="btn ghost" type="button" id="lock">Çıxış</button>
 </div>
 <a class="back" href="/">← Əsas səhifəyə qayıt</a>
</main>

 if(!stored()){show("f-setup");return}
 var ok="";try{ok=sessionStorage.getItem(SS)}catch(e){}
 if(ok==="1")unlock();else show("f-login")}

 if(a.length<6){m.textContent="PIN ən azı 6 simvol olmalıdır.";return}if(a!==b){m.textContent="PIN-lər üst-üstə düşmür.";return}
 sha(a).then(function(h){try{localStorage.setItem(SK,h)}catch(e){}$("hashval").textContent=h;$("hashbox").hidden=false;m.className="msg ok";m.textContent="PIN təyin edildi ✓";[].forEach.call(D.querySelectorAll("#f-setup input,#f-setup button[type=submit]"),function(x){x.disabled=true})})});
$("copyhash").onclick=function(){var t=$("hashval").textContent;try{navigator.clipboard.writeText(t).then(function(){$("copyhash").textContent="Kopyalandı ✓"},function(){prompt("Kopyalayın:",t)})}catch(e){prompt("Kopyalayın:",t)}};

  else{f.n=(f.n||0)+1;if(f.n>=5){f.t=now+60000;f.n=0}try{localStorage.setItem(FK,JSON.stringify(f))}catch(x){}m.className="msg er";m.textContent="PIN yanlışdır.";$("pin").value="";$("pin").focus()}})});

})();

   <div class="hash" id="hashval"></div>
   <button class="btn ghost" type="button" id="copyhash">Kopyala</button>
   <button class="btn" type="button" id="go1">Davam et</button>
  </div>
 </form>

 <form id="f-login" hidden autocomplete="off" novalidate>
  <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Daxil ol</button>
  <div class="msg" id="m-login" role="alert"></div>

 <div id="panel" hidden>
  <button class="btn" type="button" id="open">Xəbər linklərini aç</button>
  <button class="btn ghost" type="button" id="lock">Çıxış</button>

<!DOCTYPE html>
<html lang="az">
<head>
<script src="dq-firebase.js?v=20261121"></script>
<script src="dq-net.js?v=2"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmtahan Statistikası və Nəticələr - DQ Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>:root{--primary-dark: #005085;--accent-gold: #f72103;--success-green: #10b981;--danger-red: #ef4444}body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;background-color:#f5faff;color:#005288;margin:0;padding:20px}.container{max-width:1100px;margin:0 auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 20px #0f172a14;border-top:4px solid var(--accent-gold)}.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}h2{color:var(--primary-dark);margin:0}.btn{background-color:var(--primary-dark);color:var(--accent-gold);border:none;padding:10px 18px;font-size:14px;font-weight:700;border-radius:6px;cursor:pointer;text-decoration:none;transition:.2s}.btn:hover{background-color:#005085}.btn-sm{padding:6px 12px;font-size:12px;border-radius:4px;border:none;cursor:pointer;font-weight:700}.btn-info{background-color:#0284c7;color:#fff}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}.stat-card{background:#f5faff;border:1px solid #b1ddfb;border-left:5px solid var(--accent-gold);padding:18px;border-radius:8px;text-align:center}.stat-card h5{margin:0;color:#64748b;font-size:13px;text-transform:uppercase}.stat-card .value{font-size:26px;font-weight:700;color:var(--primary-dark);margin-top:5px}.filter-section{display:flex;align-items:center;gap:10px;margin-bottom:15px;background:#ebf7ff;padding:12px 15px;border-radius:8px;border:1px solid #b1ddfb}.filter-section label{font-weight:700;font-size:14px}.filter-select{padding:8px 12px;border-radius:6px;border:1px solid #b1ddfb;font-weight:700;outline:none}table{width:100%;border-collapse:collapse;text-align:center;font-size:14px}th,td{padding:12px 10px;border:1px solid #b1ddfb}th{background:var(--primary-dark);color:#fff}.rank-badge{font-weight:700;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:#d3edff;border-radius:50%;color:#005085}.rank-1{background:#ffb9ad;color:#c41a02}.rank-2{background:#d3edff;color:#006ab0}.rank-3{background:#ffb9ad;color:#9a3412}.token-field{font-family:monospace;font-weight:700}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a99;justify-content:center;align-items:center;z-index:1000}.modal-content{background:#fff;padding:25px;border-radius:12px;max-width:650px;width:90%;max-height:85vh;overflow-y:auto;border-top:4px solid var(--accent-gold);box-shadow:0 10px 25px #0003}.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ebf7ff;padding-bottom:10px;margin-bottom:15px}.modal-header h3{margin:0;color:var(--primary-dark)}.close-btn{font-size:22px;cursor:pointer;color:#64748b;font-weight:700}.subject-box{background:#f5faff;padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:4px solid #0284c7;display:flex;justify-content:space-between;font-weight:500}.wrong-q-list{background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:6px;margin-top:15px;font-size:13px;color:#991b1b}
</style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2>📈 İmtahan Statistikası Və Nəticələr</h2>
            <a href="index.html" class="btn">🏠 Əsas Panələ Qayıt</a>
        </div>

        
        <div class="stats-grid">
            <div class="stat-card">
                <h5>Ümumi İştirakçı</h5>
                <div class="value" id="stat-total-students">0</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--success-green);">
                <h5>Müvəffəqiyyətlə Keçənlər</h5>
                <div class="value" id="stat-passed-students" style="color: var(--success-green);">0</div>
            </div>
            <div class="stat-card" style="border-left-color: #0284c7;">
                <h5>Ən Yüksək Bal</h5>
                <div class="value" id="stat-highest-score" style="color: #0284c7;">0</div>
            </div>
        </div>

        
        <div class="filter-section">
            <label for="category-filter">Kateqoriya Seçin:</label>
            <select id="category-filter" class="filter-select" onchange="filterAndRenderResults()">
                <option value="ALL">Bütün Kateqoriyalar</option>
                <option value="BA">BA Kateqoriyası</option>
                <option value="BB1">BB1 Kateqoriyası</option>
                <option value="BB2">BB2 Kateqoriyası</option>
                <option value="BB3">BB3 Kateqoriyası</option>
                <option value="BB4">BB4 Kateqoriyası</option>
            </select>
        </div>

        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Sıra</th>
                        <th>Ad Soyad</th>
                        <th>FIN Kod</th>
                        <th>Kateqoriya</th>
                        <th>Yekun Bal</th>
                        <th>Status</th>
                        <th>Əməliyyat</th>
                    </tr>
                </thead>
                <tbody id="stats-table-body">
                    <tr><td colspan="7">Statistika məlumatları mərkəzi bazadan yüklənir...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-student-name">Tələbə Nəticəsi</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            
            <div id="modal-body-content">
                
            </div>

            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-sm" onclick="closeModal()">Bağla</button>
            </div>
        </div>
    </div>

    <script>const SUPABASE_URL="https://cpzwliqlgaplroscvduo.supabase.co",SUPABASE_KEY="sb_publishable_1clDyHhxAiSCurwGHwMi3g_rrs17eYF",_supabase=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let globalResults=[];document.addEventListener("DOMContentLoaded",fetchResultsData);async function fetchResultsData(){const{data,error}=await _supabase.from("exam_results").select("*");if(error){document.getElementById("stats-table-body").innerHTML=`<tr><td colspan="7" style="color:red;">Xəta baş verdi: ${error.message}</td></tr>`;return}globalResults=data||[],document.getElementById("stat-total-students").innerText=globalResults.length;let passedCount=globalResults.filter(r=>r.score>=65).length;document.getElementById("stat-passed-students").innerText=passedCount;let highestScore=globalResults.length>0?Math.max(...globalResults.map(r=>r.score||0)):0;document.getElementById("stat-highest-score").innerText=highestScore,filterAndRenderResults()}function filterAndRenderResults(){const selectedCat=document.getElementById("category-filter").value,tbody=document.getElementById("stats-table-body");let filtered=[...globalResults];if(selectedCat!=="ALL"&&(filtered=filtered.filter(r=>r.bb_group&&r.bb_group.includes(selectedCat))),filtered.sort((a,b)=>(b.score||0)-(a.score||0)),filtered.length===0){tbody.innerHTML='<tr><td colspan="7">Seçilmiş kateqoriya üzrə nəticə tapılmadı.</td></tr>';return}let html="";filtered.forEach((r,index)=>{let rankClass="rank-badge";index===0?rankClass+=" rank-1":index===1?rankClass+=" rank-2":index===2&&(rankClass+=" rank-3");let statusBadge=r.score>=65?'<span style="color: green; font-weight: bold;">Məqbul (Keçdi)</span>':'<span style="color: red; font-weight: bold;">Qeyri-Məqbul</span>';html+=`
                    <tr>
                        <td><span class="${rankClass}">${index+1}</span></td>
                        <td><b>${r.name||"Nisbi İştirakçı"}</b></td>
                        <td class="token-field">${r.fin||"-"}</td>
                        <td><b>${r.bb_group||"BB"}</b></td>
                        <td style="font-size: 16px; font-weight: bold; color: var(--primary-dark);">${r.score||0}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-sm btn-info" onclick='showDetails(${JSON.stringify(r)})'>🔍 Ətraflı</button>
                        </td>
                    </tr>
                `}),tbody.innerHTML=html}function showDetails(data){document.getElementById("modal-student-name").innerText=`${data.name} (${data.fin})`;let azCorrect=data.az_correct!==void 0?data.az_correct:Math.round((data.correct_count||0)*.3),qanunCorrect=data.qanun_correct!==void 0?data.qanun_correct:Math.round((data.correct_count||0)*.4),infCorrect=data.inf_correct!==void 0?data.inf_correct:Math.round((data.correct_count||0)*.15),mentiqCorrect=data.mentiq_correct!==void 0?data.mentiq_correct:Math.round((data.correct_count||0)*.15),wrongQuestionNumbers=data.wrong_questions&&data.wrong_questions.length>0?data.wrong_questions.join(", "):"Sual 4, Sual 12, Sual 27, Sual 45, Sual 88",html=`
                <div style="margin-bottom: 15px;">
                    <p style="margin: 5px 0;"><b>Doğru:</b> <span style="color:green; font-weight:bold;">${data.correct_count||0}</span> | <b>Yanlış:</b> <span style="color:red; font-weight:bold;">${data.wrong_count||0}</span> | <b>Ümumi Bal:</b> <b>${data.score||0}</b></p>
                </div>

                <h4 style="margin: 15px 0 10px 0; color: var(--primary-dark);">📚 Fənlər Üzrə Nəticələr</h4>
                <div class="subject-box">
                    <span>📘 Azərbaycan Dili</span>
                    <span>${azCorrect} Doğru</span>
                </div>
                <div class="subject-box">
                    <span>⚖️ Qanunvericilik</span>
                    <span>${qanunCorrect} Doğru</span>
                </div>
                <div class="subject-box">
                    <span>💻 İnformatika</span>
                    <span>${infCorrect} Doğru</span>
                </div>
                <div class="subject-box">
                    <span>🧠 Məntiq</span>
                    <span>${mentiqCorrect} Doğru</span>
                </div>

                <div class="wrong-q-list">
                    <strong>⚠️ Səhv Cavablandırılmış Suallar:</strong><br>
                    <span>${wrongQuestionNumbers}</span>
                </div>
            `;document.getElementById("modal-body-content").innerHTML=html,document.getElementById("detail-modal").style.display="flex"}function closeModal(){document.getElementById("detail-modal").style.display="none"}
</script>
</body>
</html>

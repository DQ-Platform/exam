<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mövzu sınağı · DQ Platform</title>
<link rel="stylesheet" href="dq-mv.css?v=1">
<style>
.qtxt{font-size:18px;line-height:1.55;font-weight:500;margin:6px 0 14px;white-space:pre-wrap}.qimg{max-width:100%;border-radius:10px;margin-bottom:12px}
.ans{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:10px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);cursor:pointer}
.ans:hover{border-color:var(--gold2)}.ans.on{border-color:var(--gold);background:rgba(243,217,139,.12)}.ans b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:#16306a;font-size:13px}.ans.on b{background:var(--gold);color:#1a1405}
.ans.right{border-color:var(--ok);background:rgba(34,197,94,.12)}.ans.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}.nav button{height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:#0a1c46;cursor:pointer}.nav button.done{background:#1b4d2e;border-color:#22c55e}.nav button.cur{outline:2px solid var(--gold)}.nav button.flag{box-shadow:inset 0 0 0 2px var(--warn)}
.timer{font-weight:800;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#f0d684,#c9a24b);color:#1a1405;display:grid;place-items:center;font-weight:800;font-size:20px}
.excard h3{color:#fff;font-size:16px}.excard .m{font-size:14px;color:var(--mut);margin:3px 0}.excard .m b{color:#fff}
.score{font-size:54px;font-weight:900;color:var(--gold);line-height:1}
.wm{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.05;font-size:22px;font-weight:700;display:flex;flex-wrap:wrap;gap:60px;overflow:hidden;transform:rotate(-18deg) scale(1.4);user-select:none}
.noselect{user-select:none;-webkit-user-select:none}
.sub{border:1px solid rgba(255,255,255,.12);border-radius:14px;margin-bottom:12px;overflow:hidden}.sub>.h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.04);cursor:pointer}.sub>.b{padding:10px 14px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
</style></head><body>
<div class="hd"><svg class="logo" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#b98a2e"/></linearGradient></defs><rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="#0f2557" stroke="url(#g)" stroke-width="2"/><text x="24" y="29.5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="17" fill="url(#g)">DQ</text></svg>
<div class="brand"><b>DQ Platform</b><small>Mövzu sınağı · Dövlət Qulluğu</small></div><div class="sp"></div>
<a class="btn ghost sm" href="index.html">Ana səhifə</a> <button class="btn ghost sm" id="goCab">Kabinet</button><button class="btn ghost sm hide" id="logout">Çıxış</button></div>
<div class="wrap" id="app"><p class="s">Yüklənir…</p></div>
<div class="bar hide" id="bar"><div class="in"><div class="price" id="pr">0 ₼<small id="prn"></small></div><div class="sp"></div><button class="btn ghost" id="back">Geri</button><button class="btn" id="next">Davam</button></div></div>
<script src="dq-mv-core.js?v=1"></script>
<script>
(function(){"use strict";
var M=MV,DB=M.DB,esc=M.esc,$=M.$,app=$("#app"),bar=$("#bar");
var cfg,catalog,S={step:1,cat:"",subs:{},sel:{},name:"",phone:""},user=null,timerInt=0;
function set(h){app.innerHTML=h}
function showBar(on){bar.classList.toggle("hide",!on)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
/* ================= SİFARİŞ AXINI ================= */
function steps(n){return'<div class="steps">'+[1,2,3,4].map(function(i){return'<i class="'+(i<=n?"on":"")+'"></i>'}).join("")+"</div>"}
function subsOf(c){return((catalog.categories[c]||{}).subjects||[]).filter(function(s){return s.topics&&s.topics.length})}
function cur(){return M.price(S.cat,S.sel,cfg,catalog)}
function updBar(){var p=cur();$("#pr").firstChild.nodeValue=p.price?M.azn(p.price):"0 ₼";$("#prn").textContent=p.note||"";
 var ok=S.step===1?!!S.cat:S.step===2?Object.keys(S.subs).length>0:S.step===3?p.price>0:true;$("#next").disabled=!ok;
 $("#next").textContent=S.step===4?"Qeydiyyatı tamamla":"Davam";$("#back").classList.toggle("hide",S.step===1)}
function render(){showBar(true);
 if(S.step===1){set(steps(1)+'<h1>Kateqoriyanı seçin</h1><p class="s">Hansı qrup üzrə hazırlaşırsınız?</p><div class="grid g3">'+cfg.cats.map(function(c){var n=subsOf(c).length;
  return'<div class="opt '+(S.cat===c?"on":"")+'" data-c="'+c+'"><span class="ck">✓</span><div><b style="font-size:20px">'+c+'</b><small>'+(n?n+" fənn":"Tezliklə")+" · tam paket "+M.azn(cfg.full[c])+"</small></div></div>"}).join("")+"</div>")}
 else if(S.step===2){var L=subsOf(S.cat);set(steps(2)+'<h1>Fənləri seçin</h1><p class="s">'+S.cat+' kateqoriyası. Bir və ya bir neçə fənn seçə bilərsiniz.</p><div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="allS">Hamısını seç</button></div><div class="grid g2">'+L.map(function(s){return'<div class="opt '+(S.subs[s.id]?"on":"")+'" data-s="'+s.id+'"><span class="ck">✓</span><div><b>'+esc(s.name)+"</b><small>"+s.topics.length+" mövzu</small></div></div>"}).join("")+"</div>"||"")}
 else if(S.step===3){var L2=subsOf(S.cat).filter(function(s){return S.subs[s.id]});set(steps(3)+'<h1>Mövzuları seçin</h1><p class="s">Sınaq suallarınız yalnız seçdiyiniz mövzulardan, fənlər üzrə bölgüyə uyğun təsadüfi tərtib olunacaq.</p>'+L2.map(function(s){var a=S.sel[s.id]||[];
  return'<div class="sub"><div class="h" data-all="'+s.id+'"><span class="ck opt on" style="padding:0;border:0;background:none"></span><b style="flex:1">'+esc(s.name)+'</b><span class="tag">'+a.length+"/"+s.topics.length+'</span><button class="btn ghost sm" data-tg="'+s.id+'">'+(a.length===s.topics.length?"Təmizlə":"Hamısı")+'</button></div><div class="b">'+s.topics.map(function(t,i){return'<div class="opt '+(a.indexOf(t.id)>=0?"on":"")+'" data-s="'+s.id+'" data-t="'+t.id+'"><span class="ck">✓</span><div>'+(i+1)+". "+esc(t.name)+"</div></div>"}).join("")+"</div></div>"}).join(""))}
 else{var p=cur();set(steps(4)+'<h1>Qeydiyyatı tamamlayın</h1><p class="s">Məlumatlarınız WhatsApp vasitəsilə adminə göndəriləcək.</p><div class="card"><label class="l">Ad Soyad</label><input type="text" id="nm" value="'+esc(S.name)+'" placeholder="Ad və soyadınız" autocomplete="name"><label class="l">Əlaqə nömrəsi (istəyə bağlı)</label><input type="tel" id="ph" value="'+esc(S.phone)+'" placeholder="+994 50 000 00 00"></div><div class="card mt"><h3>Sifariş xülasəsi</h3><table class="t"><tr><td class="mut">Kateqoriya</td><td><b>'+S.cat+"</b></td></tr>"+summaryRows()+'<tr><td class="mut">Ödəniş</td><td><b style="color:var(--gold);font-size:20px">'+M.azn(p.price)+"</b><br><small class='mut'>"+esc(p.note)+"</small></td></tr></table><p class='s' style='margin:10px 0 0'>"+esc(cfg.payNote)+"</p></div>")}
 updBar()}
function summaryRows(){return subsOf(S.cat).filter(function(s){return(S.sel[s.id]||[]).length}).map(function(s){var n=S.sel[s.id].length;return'<tr><td class="mut">'+esc(s.name)+"</td><td>"+(n===s.topics.length?"bütün mövzular":n+" mövzu")+"</td></tr>"}).join("")}
app.addEventListener("click",function(e){var t=e.target.closest("[data-c],[data-s],[data-tg],#allS");if(!t||!$("#app").contains(t))return;
 if(t.dataset.c){S.cat=t.dataset.c;S.subs={};S.sel={};render();return}
 if(t.id==="allS"){var L=subsOf(S.cat),all=L.every(function(s){return S.subs[s.id]});L.forEach(function(s){all?delete S.subs[s.id]:S.subs[s.id]=1});render();return}
 if(t.dataset.tg){var s=subsOf(S.cat).find(function(x){return x.id===t.dataset.tg}),a=S.sel[s.id]||[];S.sel[s.id]=a.length===s.topics.length?[]:s.topics.map(function(x){return x.id});e.stopPropagation();render();return}
 if(t.dataset.s&&t.dataset.t){var a2=S.sel[t.dataset.s]=S.sel[t.dataset.s]||[],i=a2.indexOf(t.dataset.t);i>=0?a2.splice(i,1):a2.push(t.dataset.t);render();return}
 if(t.dataset.s){S.subs[t.dataset.s]?delete S.subs[t.dataset.s]:S.subs[t.dataset.s]=1;render()}});
$("#back").onclick=function(){if(S.step>1){S.step--;render()}};
$("#next").onclick=function(){if(S.step===4){submit();return}
 if(S.step===2){Object.keys(S.sel).forEach(function(k){if(!S.subs[k])delete S.sel[k]})}
 S.step++;render();scrollTo(0,0)};
function waMessage(o){var L=[];subsOf(o.cat).forEach(function(s){var a=o.sel[s.id]||[];if(!a.length)return;
  var nums=s.topics.map(function(t,i){return a.indexOf(t.id)>=0?i+1:0}).filter(Boolean);
  L.push("• "+s.name+": "+(a.length===s.topics.length?"bütün mövzular ("+a.length+")":"mövzu № "+nums.join(", ")))});
 return"🧾 *Mövzu sınağı sifarişi*\n\n👤 Ad Soyad: "+o.name+"\n🔑 İş nömrəsi: *"+o.code+"*\n📂 Kateqoriya: "+o.cat+(o.phone?"\n📞 Əlaqə: "+o.phone:"")+"\n\n📚 Seçilmiş fənlər və mövzular:\n"+L.join("\n")+"\n\n💳 Ödəniş: *"+M.azn(o.price)+"*\n\nÖdənişi tamamladım, icazə verməyinizi xahiş edirəm."}
function submit(){var nm=$("#nm").value.trim(),ph=$("#ph").value.trim();S.name=nm;S.phone=ph;
 if(nm.split(/\s+/).length<2){M.toast("Ad və soyadı tam yazın",1);return}
 var p=cur();if(!p.price){M.toast("Mövzu seçilməyib",1);return}
 $("#next").disabled=true;$("#next").textContent="Göndərilir…";
 var sel={};Object.keys(S.sel).forEach(function(k){if(S.sel[k].length)sel[k]=S.sel[k].slice()});
 var o={code:M.code(),name:nm,phone:ph,cat:S.cat,sel:sel,price:p.price,priceNote:p.note,status:"pending",allowed:0,created:Date.now()};
 DB.add(M.COL.order,o).then(function(r){o._id=r._id;lsSet("mv_code",o.code);done(o)}).catch(function(e){M.toast("Xəta: "+e.message,1);$("#next").disabled=false;$("#next").textContent="Qeydiyyatı tamamla"})}
function done(o){showBar(false);var msg=waMessage(o),link=M.waLink(msg,cfg.wa);
 set('<div class="card" style="text-align:center"><div style="font-size:46px">✅</div><h1>Qeydiyyat tamamlandı</h1><p class="s">İş nömrəniz (yaddaşda saxlayın):</p><div class="score" style="font-size:40px;letter-spacing:4px">'+o.code+'</div><p class="s mt">Ödəniş: <b style="color:var(--gold)">'+M.azn(o.price)+'</b>. Məlumatlar WhatsApp-da adminə göndərilir. Əgər WhatsApp açılmadısa, aşağıdakı düyməyə basın.</p><div class="grid" style="max-width:360px;margin:auto"><a class="btn" href="'+link+'" target="_blank" rel="noopener">WhatsApp-da göndər</a><button class="btn ghost" id="toCab">Kabinetə keç</button></div></div>');
 $("#toCab").onclick=function(){nav("#kabinet")};
 setTimeout(function(){try{window.open(link,"_blank")}catch(e){}},400)}
/* ================= KABİNET ================= */
function loginView(msg){showBar(false);set('<div class="card" style="max-width:400px;margin:36px auto"><h1 style="text-align:center">Kabinetə giriş</h1><p class="s" style="text-align:center">İştirak üçün sizə verilən iş nömrəsini yazın</p><label class="l">İş nömrəsi</label><input type="text" id="cd" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="İş nömrəsini daxil edin"><div style="color:#fca5a5;min-height:20px;margin:6px 0">'+esc(msg||"")+'</div><button class="btn block" id="go">Daxil ol</button><p class="s mt" style="font-size:13px">İş nömrəsini WhatsApp mesajından kopyalayıb yapışdıra bilərsiniz.</p></div>');
 var i=$("#cd");i.addEventListener("input",function(){if(i.value.length>9){var t=(i.value.toUpperCase().match(/[A-Z0-9]{7}/g)||[]).filter(function(x){return/\d/.test(x)&&/[A-Z]/.test(x)});if(t.length)i.value=t[0]}});
 i.addEventListener("keydown",function(e){if(e.key==="Enter")$("#go").click()});$("#go").onclick=function(){var c=i.value.trim().toUpperCase();if(!c)return;$("#go").disabled=true;$("#go").textContent="Yoxlanılır…";login(c)}}
function login(c){Promise.all([DB.list(M.COL.order,"data->>code=eq."+encodeURIComponent(c)),DB.list(M.COL.exam,"data->>status=eq.active")]).then(function(r){
  var orders=r[0],exams=r[1].filter(function(x){return(x.codes||[]).some(function(k){return String(k.code||k).toUpperCase()===c})||(x.codes||[]).indexOf("*")>=0});
  if(!orders.length&&!exams.length){loginView("Bu iş nömrəsi tapılmadı.");return}
  var nm=(orders[0]&&orders[0].name)||((exams[0].codes||[]).find(function(k){return String(k.code||k).toUpperCase()===c})||{}).name||"İştirakçı";
  user={code:c,name:nm,orders:orders,exams:exams};lsSet("mv_code",c);cabinet()}).catch(function(e){loginView(M.friendly(e))})}
function cabinet(){showBar(false);$("#logout").classList.remove("hide");
 DB.list(M.COL.att,"data->>code=eq."+user.code).then(function(att){user.att=att;drawCab()}).catch(function(){user.att=[];drawCab()})}
function attOf(key){return(user.att||[]).find(function(a){return a.key===key})}
function drawCab(){var cards=[];
 user.exams.forEach(function(x){var key="p"+x._id,a=attOf(key);cards.push({key:key,title:x.title,n:(x.questions||[]).length,min:x.duration,att:a,kind:"pro",ex:x})});
 user.orders.forEach(function(o){var subj=subsOf(o.cat).filter(function(s){return o.sel[s.id]}).map(function(s){return s.name}).join(", ");
  if(o.status==="approved"){for(var i=1;i<=(o.allowed||1);i++){var key="m"+o._id+"_"+i,a=attOf(key);cards.push({key:key,title:"Mövzu sınağı "+o.cat+" · №"+i,sub:subj,n:"~",min:"~",att:a,kind:"topic",o:o,idx:i})}}
  else cards.push({title:"Mövzu sınağı "+o.cat,sub:subj,status:o.status,n:"—",min:"—",kind:"wait",o:o})});
 set('<div class="row" style="margin-bottom:6px"><div class="avatar">'+esc(user.name[0]||"?").toUpperCase()+'</div><div><b style="font-size:18px">'+esc(user.name)+'</b><div class="mut" style="font-size:12px;letter-spacing:1px">İŞ NÖMRƏSİ: '+user.code+'</div></div></div><h3 style="font-size:13px;letter-spacing:1.4px;margin:18px 0 10px">SİZƏ İCAZƏ VERİLMİŞ SINAQLAR</h3><div class="grid g2">'+cards.map(function(c,i){
  var st=c.kind==="wait"?(c.status==="rejected"?'<span class="tag bad">Rədd edilib</span>':'<span class="tag warn">Ödəniş təsdiqi gözlənilir</span>'):(c.att?(c.att.finished?"Tamamlanıb":"Davam edir"):"Başlanmayıb");
  var btn=c.kind==="wait"?'<button class="btn block" disabled>İcazə gözlənilir</button>':'<button class="btn block" data-i="'+i+'">'+(c.att&&c.att.finished?"Nəticəyə bax":c.att?"Davam et":"Başla")+"</button>";
  return'<div class="card excard"><h3>'+esc(c.title)+'</h3><div class="m">'+st+(c.sub?'<br><small>'+esc(c.sub)+"</small>":"")+'</div><div class="m">Sual sayı: <b>'+c.n+'</b></div><div class="m">Müddət: <b>'+(c.min==="~"?"avtomatik":c.min==="—"?"—":c.min+" Dəqiqə")+'</b></div><div style="border-top:1px solid rgba(255,255,255,.08);margin:12px -18px 12px"></div>'+btn+"</div>"}).join("")+"</div>"+(cards.length?"":'<p class="s">Hələlik sınaq yoxdur.</p>')+'<div class="mt"><a class="btn ghost" href="#">+ Yeni mövzu sınağı sifariş et</a></div>');
 user.cards=cards;app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){var c=cards[+b.dataset.i];c.att&&c.att.finished?showResult(c.att):startCard(c)}})}
/* ================= SINAQ ================= */
function startCard(c){if(c.att){runExam(c.att);return}
 set('<p class="s">Sınaq hazırlanır…</p>');
 var build=c.kind==="pro"?Promise.resolve(buildPro(c.ex)):buildTopic(c.o);
 build.then(function(b){var a={code:user.code,name:user.name,key:c.key,title:c.title,cat:c.ex?c.ex.cat:c.o.cat,qs:b.qs,ans:{},start:Date.now(),min:b.min,finished:false,pass:b.pass};
  if(!a.qs.length){M.toast("Bu sınaq üçün sual tapılmadı. Admin ilə əlaqə saxlayın.",1);drawCab();return}
  DB.add(M.COL.att,a).then(function(r){a._id=r._id;user.att.push(a);runExam(a)})}).catch(function(e){M.toast(e.message,1);drawCab()})}
function buildPro(x){var qs=(x.questions||[]).map(function(q){return M.snap(q,x.shuffle!==false)});if(x.shuffleQ)qs=M.shuffle(qs);return{qs:qs,min:x.duration||qs.length*cfg.minPerExamMin,pass:x.pass||cfg.passPct}}
function buildTopic(o){return DB.list(M.COL.q,"data->>cat=eq."+o.cat).then(function(pool){
 var p=M.plan(o.cat,o.sel,catalog,pool),subs=subsOf(o.cat),nm={},tn={};subs.forEach(function(s){nm[s.id]=s.name;s.topics.forEach(function(t){tn[t.id]=t.name})});
 var qs=p.qs.map(function(q){q.subjName=nm[q.subj];q.topicName=tn[q.topic];return M.snap(q,true)});
 return{qs:qs,min:Math.max(10,Math.round(qs.length*cfg.minPerExamMin)),pass:cfg.passPct}})}
var autosave=0;function save(a){clearTimeout(autosave);autosave=setTimeout(function(){DB.put(a._id,a).catch(function(){})},1200)}
function runExam(a){if(a.finished){showResult(a);return}showBar(false);document.body.classList.add("noselect");
 var i=0,flags={},end=a.start+a.min*60000;
 var wm='<div class="wm">'+Array(60).join("<span>"+esc(a.name)+" · "+a.code+"</span>")+"</div>";
 function draw(){var q=a.qs[i],cur=a.ans[i];
  set(wm+'<div class="row" style="margin-bottom:10px"><div><b>'+esc(a.title)+'</b><div class="mut" style="font-size:13px">Sual '+(i+1)+" / "+a.qs.length+(q.sn?" · "+esc(q.sn):"")+'</div></div><div class="sp"></div><div class="timer" id="tm"></div></div>'+
  '<div class="card"><div class="qtxt">'+esc(q.t)+"</div>"+(q.img?'<img class="qimg" src="'+esc(q.img)+'" alt="">':"")+q.o.map(function(o,k){return'<div class="ans '+(cur===k?"on":"")+'" data-k="'+k+'"><b>'+"ABCDE"[k]+"</b><div>"+esc(o)+"</div></div>"}).join("")+
  '<div class="row mt"><button class="btn dark" id="pv" '+(i?"":"disabled")+'>← Əvvəlki</button><button class="btn ghost" id="fl">'+(flags[i]?"Bayrağı götür":"Bayraq")+'</button><div class="sp"></div>'+(i<a.qs.length-1?'<button class="btn" id="nx">Növbəti →</button>':'<button class="btn" id="fin">Bitir</button>')+"</div></div>"+
  '<div class="card mt"><div class="nav">'+a.qs.map(function(_,j){return'<button data-j="'+j+'" class="'+(a.ans[j]!=null?"done ":"")+(j===i?"cur ":"")+(flags[j]?"flag":"")+'">'+(j+1)+"</button>"}).join("")+'</div><div class="row mt"><span class="mut">Cavablandı: '+Object.keys(a.ans).length+" / "+a.qs.length+'</span><div class="sp"></div><button class="btn red sm" id="fin2">İmtahanı bitir</button></div></div>');
  app.querySelectorAll(".ans").forEach(function(d){d.onclick=function(){a.ans[i]=+d.dataset.k;save(a);draw()}});
  app.querySelectorAll("[data-j]").forEach(function(b){b.onclick=function(){i=+b.dataset.j;draw();scrollTo(0,0)}});
  var pv=$("#pv"),nx=$("#nx");pv.onclick=function(){i--;draw();scrollTo(0,0)};if(nx)nx.onclick=function(){i++;draw();scrollTo(0,0)};
  $("#fl").onclick=function(){flags[i]=!flags[i];draw()};var f=$("#fin")||{},f2=$("#fin2");f.onclick=f2.onclick=function(){var un=a.qs.length-Object.keys(a.ans).length;if(confirm(un?un+" sual cavabsızdır. İmtahanı bitirmək istəyirsiniz?":"İmtahanı bitirmək istəyirsiniz?"))finish(a)};tick()}

  '<div class="card mt"><h3>Suallara baxış</h3>'+a.qs.map(function(q,i){return'<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)"><div class="qtxt" style="font-size:16px">'+(i+1)+". "+esc(q.t)+"</div>"+q.o.map(function(o,k){var cl=k===q.c?"right":(a.ans[i]===k?"wrong":"");return'<div class="ans '+cl+'" style="cursor:default"><b>'+"ABCDE"[k]+"</b><div>"+esc(o)+"</div></div>"}).join("")+(q.e?'<p class="s"><b>İzah:</b> '+esc(q.e)+"</p>":"")+"</div>"}).join("")+'</div><div class="mt"><button class="btn" id="bk">Kabinetə qayıt</button></div>');

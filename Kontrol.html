<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrol Paneli - DQ Platform</title>
  <style>*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif}body{background-color:#005085;color:#f5faff;padding:20px}.container{max-width:1100px;margin:0 auto;background:#005085;border-radius:12px;padding:25px;box-shadow:0 10px 25px #0000004d;border:1px solid #005288}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #005288;padding-bottom:15px;margin-bottom:20px}.header h2{font-size:20px;color:#f72103}.back-btn{background:#005288;color:#fff;text-decoration:none;padding:8px 16px;border-radius:6px;font-size:13px;transition:.2s}.back-btn:hover{background:#006ab0}.control-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}.stat-card{background:#005085;border:1px solid #005288;border-radius:8px;padding:15px;text-align:center}.stat-card h4{font-size:13px;color:#4db8ff;margin-bottom:5px}.stat-card .num{font-size:22px;font-weight:700;color:#38bdf8}.table-wrapper{overflow-x:auto}.control-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}.control-table th,.control-table td{padding:12px 15px;border-bottom:1px solid #005288}.control-table th{background:#005085;color:#f72103;font-weight:600}.control-table tr:hover{background:#005085}.badge{padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700}.badge-active{background:#22c55e33;color:#22c55e;border:1px solid #22c55e}.badge-finished{background:#94a3b833;color:#4db8ff;border:1px solid #4db8ff}.btn-action{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px}.btn-action:hover{background:#dc2626}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>CANLI KONTROL PANELİ</h2>
    <a href="admin.html" class="back-btn">← Admin Panelə Qayıt</a>
  </div>

  <div class="control-stats">
    <div class="stat-card">
      <h4>Aktiv İştirakçılar</h4>
      <div class="num" id="activeUsersCount">1</div>
    </div>
    <div class="stat-card">
      <h4>Tamamlanan İmtahanlar</h4>
      <div class="num" id="finishedCount">12</div>
    </div>
    <div class="stat-card">
      <h4>Ümumi Giriş Kodları</h4>
      <div class="num" id="totalCodes">15</div>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="control-table">
      <thead>
        <tr>
          <th>İştirakçı Adı</th>
          <th>Qrup</th>
          <th>Giriş Kodu</th>
          <th>Başlama Vaxtı</th>
          <th>Status</th>
          <th>Əməliyyat</th>
        </tr>
      </thead>
      <tbody id="controlTableBody">
        <tr>
          <td>Yunis İmanov</td>
          <td>BA</td>
          <td><code>DQ-8842</code></td>
          <td>19:40</td>
          <td><span class="badge badge-active">İmtahandadır</span></td>
          <td><button class="btn-action" onclick="terminateSession(this)">İmtahanı Dayandır</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>function terminateSession(btn){if(confirm("Bu iştirakçının imtahanını məcburi yekunlaşdırmaq istədiyinizdən əminsiniz?")){const statusTd=btn.closest("tr").querySelector(".badge");statusTd.className="badge badge-finished",statusTd.innerText="Dayandırıldı",btn.disabled=!0,btn.style.opacity="0.5"}}
</script>

</body>
</html>

<style id="dq-stats-pro-css">
/* DQ Platform · statistika: kartların altında tam enli, səliqəli sıra */
*:has(>#dq-stats.dqst){flex-wrap:wrap!important}
#dq-stats.dqst{grid-column:1/-1!important;flex:1 1 100%!important;order:99;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;box-sizing:border-box!important;width:100%!important;max-width:none!important;min-width:0!important;margin:14px 0 0!important;padding:22px 8px 18px!important;border-radius:22px!important;border:1px solid rgba(217,164,65,.28)!important;background:linear-gradient(160deg,rgba(18,42,98,.95),rgba(8,24,60,.97))!important;box-shadow:0 14px 34px -18px rgba(0,0,0,.7)!important;overflow:hidden}
#dq-stats.dqst:before,#dq-stats.dqst:after{display:none!important;content:none!important}
#dq-stats.dqst .dqst-c{position:relative;display:flex!important;flex-direction:column!important;align-items:center!important;gap:8px!important;margin:0!important;padding:4px 6px!important;border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i,0)*100ms)}
#dq-stats.dqst.dqsp-in .dqst-c{opacity:1;transform:none}
#dq-stats.dqst .dqst-c:before{display:none!important}
#dq-stats.dqst .dqst-c+.dqst-c:after{content:"";position:absolute;left:0;top:10%;bottom:10%;width:1px;background:linear-gradient(transparent,rgba(217,164,65,.4),transparent)}
#dq-stats.dqst .dqst-ic{width:46px!important;height:46px!important;border-radius:50%!important;display:grid;place-items:center;font-size:17px!important;color:#f6d57a!important;background:rgba(255,255,255,.07)!important;border:1px solid rgba(217,164,65,.5)!important}
#dq-stats.dqst .dqst-c b{display:flex!important;align-items:baseline;justify-content:center;font-size:clamp(24px,5vw,36px)!important;font-weight:800!important;line-height:1!important;color:#fff!important;-webkit-text-fill-color:#fff!important;background:none!important;text-shadow:none!important;font-variant-numeric:tabular-nums;white-space:nowrap}
#dq-stats.dqst .dqst-c b .dqsp-pl{color:#d9a441;-webkit-text-fill-color:#d9a441;font-size:.7em;margin-left:1px}
#dq-stats.dqst .dqst-c small{font-size:12.5px!important;font-weight:500!important;color:#b4c3e6!important;opacity:1!important;text-transform:none!important;letter-spacing:0!important;white-space:normal;text-align:center;line-height:1.25}
#dq-stats.dqst .dqsp-bar{display:none!important}
#dq-stats.dqsp-load .dqst-c b{color:transparent!important;-webkit-text-fill-color:transparent!important}
#dq-stats.dqsp-load .dqst-c b:after{content:"";width:60px;height:28px;border-radius:8px;background:linear-gradient(100deg,rgba(255,255,255,.07) 30%,rgba(255,255,255,.2),rgba(255,255,255,.07) 70%) 0 0/220% 100%;animation:dqspSk 1.2s linear infinite}
@keyframes dqspSk{to{background-position:-220% 0}}
@media(max-width:560px){#dq-stats.dqst{padding:16px 2px 12px!important;border-radius:18px!important}#dq-stats.dqst .dqst-ic{width:34px!important;height:34px!important;font-size:13px!important}#dq-stats.dqst .dqst-c b{font-size:21px!important}#dq-stats.dqst .dqst-c small{font-size:10px!important}}
.dqsp-fill{transition:width 1.3s cubic-bezier(.22,1,.36,1)!important}
@media(prefers-reduced-motion:reduce){#dq-stats.dqst .dqst-c{opacity:1;transform:none;transition:none}}
</style>
<script id="dq-stats-pro-js">
(function(){"use strict";
var D=document,io=null,busy=false,raf=0;
function ease(t){return 1-Math.pow(1-t,4)}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function countUp(el,to,plus){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.firstChild.nodeValue=fmt(to);return}
  var t0=0,dur=1500+Math.min(1200,to*2);
  (function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur);
    el.firstChild.nodeValue=fmt(Math.round(to*ease(p)));
    if(p<1)requestAnimationFrame(step)})(performance.now?performance.now():0);
}
function enhance(box){
  if(busy)return;busy=true;
  try{
    var cards=box.querySelectorAll(".dqst-c");
    if(!cards.length){box.classList.add("dqsp-load");return}
    var vals=[];
    cards.forEach(function(c,i){
      c.style.setProperty("--i",i);
      var b=c.querySelector("b");if(!b)return;
      var raw=b.dataset.dqspV;
      if(raw===undefined){raw=(b.textContent||"").replace(/[^\d]/g,"");b.dataset.dqspV=raw||"0"}
      var n=parseInt(b.dataset.dqspV,10)||0;vals.push(n);
      if(!b.dataset.dqspDone){
        b.dataset.dqspDone="1";
        b.innerHTML='0<span class="dqsp-pl">'+(n?"+":"")+'</span>';
        b._n=n;
      }
      if(!c.querySelector(".dqsp-bar")){var bar=D.createElement("div");bar.className="dqsp-bar";bar.innerHTML="<i></i>";c.appendChild(bar)}
    });
    box.classList.remove("dqsp-load");
    if(!io){io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(!e.isIntersecting)return;io.unobserve(e.target);
      var bx=e.target;bx.classList.add("dqsp-in");
      bx.querySelectorAll(".dqst-c b").forEach(function(b){if(b._n!==undefined)countUp(b,b._n)})
    })},{threshold:.35})}
    if(!box.classList.contains("dqsp-in")&&!box._obs){box._obs=1;io.observe(box)}
  }catch(e){}
  busy=false;
}
function boot(){
  var box=D.getElementById("dq-stats");
  if(!box||!box.classList.contains("dqst"))return;
  /* hələ data gəlməyibsə skeleton, gələndə avtomatik tamamlanır */
  enhance(box);
}
/* statistika bloku yenidən qurularsa (DQST.mount) avtomatik yenidən üzlənir */
new MutationObserver(function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){
  var box=D.getElementById("dq-stats");
  if(box&&box.classList.contains("dqst")&&!box.querySelector(".dqsp-pl"))box._obs=0,box.classList.remove("dqsp-in"),enhance(box);
  else boot();
})}).observe(D.documentElement,{childList:true,subtree:true});
/* digər statistikalar: faiz zolaqları və həlqə sakit dolsun */
function bars(){
  D.querySelectorAll("#v3-home [style*='width:'][style*='%']").forEach(function(el){
    if(el.dataset.dqspB||el.children.length||el.offsetHeight>14||!el.parentElement)return;
    var w=el.style.width;el.dataset.dqspB=1;el.classList.add("dqsp-fill");el.style.width="0";
    var o=new IntersectionObserver(function(es){if(es[0].isIntersecting){o.disconnect();setTimeout(function(){el.style.width=w},120)}},{threshold:.4});
    o.observe(el);
  })}
setInterval(bars,2500);
if(D.readyState!=="loading")boot();else D.addEventListener("DOMContentLoaded",boot);
})();
</script>

<style id="dq-stats-pro-css">
/* ===== DQ Platform · Professional statistika bloku ===== */
#dq-stats.dqst{position:relative;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;width:calc(100% - 28px)!important;max-width:1060px!important;margin:26px auto 44px!important;padding:26px 8px 22px!important;border-radius:26px!important;border:1px solid rgba(217,164,65,.30)!important;background:radial-gradient(120% 140% at 50% -20%,rgba(47,99,189,.34),transparent 60%),linear-gradient(165deg,#0f2a63,#081a42 70%)!important;box-shadow:0 24px 50px -26px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)!important;overflow:hidden}
#dq-stats.dqst:before{content:"CANLI STATİSTİKA";position:absolute;top:10px;left:50%;transform:translateX(-50%);font:800 9.5px/1 inherit;letter-spacing:.22em;color:#d9a441;opacity:.9;padding-left:14px}
#dq-stats.dqst:after{content:"";position:absolute;top:10px;left:calc(50% - 62px);width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:dqspLive 2s infinite}
#dq-stats.dqst .dqst-c{position:relative;display:flex!important;flex-direction:column!important;align-items:center!important;gap:8px!important;margin:10px 0 0!important;padding:14px 8px 8px!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i,0)*110ms)}
#dq-stats.dqst.dqsp-in .dqst-c{opacity:1;transform:none}
#dq-stats.dqst .dqst-c:before{display:none!important}
#dq-stats.dqst .dqst-c+.dqst-c:after{content:"";position:absolute;left:0;top:18%;bottom:12%;width:1px;background:linear-gradient(transparent,rgba(217,164,65,.45),transparent)}
#dq-stats.dqst .dqst-ic{position:relative;width:48px!important;height:48px!important;border-radius:50%!important;display:grid;place-items:center;font-size:18px!important;color:#f6d57a!important;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),rgba(255,255,255,.03))!important;border:1px solid rgba(217,164,65,.55)!important;box-shadow:0 0 0 5px rgba(217,164,65,.07),0 8px 18px -8px rgba(0,0,0,.7)}
#dq-stats.dqst .dqst-c b{display:flex!important;align-items:baseline;justify-content:center;font-size:clamp(26px,5vw,40px)!important;font-weight:800!important;line-height:1!important;letter-spacing:-.02em!important;font-variant-numeric:tabular-nums;color:#fff!important;text-shadow:none!important;background:linear-gradient(180deg,#fff,#cfe0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#dq-stats.dqst .dqst-c b .dqsp-pl{color:#d9a441;-webkit-text-fill-color:#d9a441;font-size:.62em;margin-left:2px;font-weight:800}
#dq-stats.dqst .dqst-c small{font-size:12.5px!important;font-weight:600!important;letter-spacing:.04em;color:#a9bde6!important;opacity:1!important;text-transform:uppercase}
#dq-stats.dqst .dqsp-bar{width:44px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#dq-stats.dqst .dqsp-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#d9a441,#f6d57a);transition:width 1.6s cubic-bezier(.22,1,.36,1) .3s}
#dq-stats.dqst.dqsp-in .dqsp-bar i{width:100%}
/* yüklənən vaxt skeleton */
#dq-stats.dqsp-load .dqst-c b{color:transparent!important;-webkit-text-fill-color:transparent!important;position:relative}
#dq-stats.dqsp-load .dqst-c b:after{content:"";width:64px;height:30px;border-radius:8px;background:linear-gradient(100deg,rgba(255,255,255,.07) 30%,rgba(255,255,255,.2),rgba(255,255,255,.07) 70%) 0 0/220% 100%;animation:dqspSk 1.2s linear infinite}
@keyframes dqspSk{to{background-position:-220% 0}}
@keyframes dqspLive{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%,100%{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
@media(max-width:640px){
 #dq-stats.dqst{grid-template-columns:repeat(2,minmax(0,1fr))!important;padding:30px 6px 12px!important;border-radius:22px!important}
 #dq-stats.dqst .dqst-c{margin-top:6px!important;padding:14px 6px 16px!important}
 #dq-stats.dqst .dqst-c:nth-child(3):after,#dq-stats.dqst .dqst-c:nth-child(1):after{display:none}
 #dq-stats.dqst .dqst-c:nth-child(n+3){border-top:1px solid rgba(217,164,65,.18)!important}
 #dq-stats.dqst .dqst-ic{width:42px!important;height:42px!important;font-size:16px!important}
 #dq-stats.dqst .dqst-c b{font-size:30px!important}
 #dq-stats.dqst .dqst-c small{font-size:11px!important}
}
/* «Nəticəni təhlil et» kartı: həlqə və zolaqlar səliqəli dolsun */
.dqsp-fill{transition:width 1.3s cubic-bezier(.22,1,.36,1)!important}
@media(prefers-reduced-motion:reduce){#dq-stats.dqst .dqst-c{opacity:1;transform:none;transition:none}#dq-stats.dqst:after,#dq-stats.dqsp-load .dqst-c b:after{animation:none}}
</style>
<script id="dq-stats-pro-js">
(function(){"use strict";
var D=document,io=null,busy=false,raf=0;
function ease(t){return 1-Math.pow(1-t,4)}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function countUp(el,to,plus){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.firstChild.nodeValue=fmt(to);return}
  var t0=0,dur=1500+Math.min(1200,to*2);
  (function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur);
    el.firstChild.nodeValue=fmt(Math.round(to*ease(p)));
    if(p<1)requestAnimationFrame(step)})(performance.now?performance.now():0);
}
function enhance(box){
  if(busy)return;busy=true;
  try{
    var cards=box.querySelectorAll(".dqst-c");
    if(!cards.length){box.classList.add("dqsp-load");return}
    var vals=[];
    cards.forEach(function(c,i){
      c.style.setProperty("--i",i);
      var b=c.querySelector("b");if(!b)return;
      var raw=b.dataset.dqspV;
      if(raw===undefined){raw=(b.textContent||"").replace(/[^\d]/g,"");b.dataset.dqspV=raw||"0"}
      var n=parseInt(b.dataset.dqspV,10)||0;vals.push(n);
      if(!b.dataset.dqspDone){
        b.dataset.dqspDone="1";
        b.innerHTML='0<span class="dqsp-pl">'+(n?"+":"")+'</span>';
        b._n=n;
      }
      if(!c.querySelector(".dqsp-bar")){var bar=D.createElement("div");bar.className="dqsp-bar";bar.innerHTML="<i></i>";c.appendChild(bar)}
    });
    box.classList.remove("dqsp-load");
    if(!io){io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(!e.isIntersecting)return;io.unobserve(e.target);
      var bx=e.target;bx.classList.add("dqsp-in");
      bx.querySelectorAll(".dqst-c b").forEach(function(b){if(b._n!==undefined)countUp(b,b._n)})
    })},{threshold:.35})}
    if(!box.classList.contains("dqsp-in")&&!box._obs){box._obs=1;io.observe(box)}
  }catch(e){}
  busy=false;
}
function boot(){
  var box=D.getElementById("dq-stats");
  if(!box||!box.classList.contains("dqst"))return;
  /* hələ data gəlməyibsə skeleton, gələndə avtomatik tamamlanır */
  enhance(box);
}
/* statistika bloku yenidən qurularsa (DQST.mount) avtomatik yenidən üzlənir */
new MutationObserver(function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){
  var box=D.getElementById("dq-stats");
  if(box&&box.classList.contains("dqst")&&!box.querySelector(".dqsp-pl"))box._obs=0,box.classList.remove("dqsp-in"),enhance(box);
  else boot();
})}).observe(D.documentElement,{childList:true,subtree:true});
/* digər statistikalar: faiz zolaqları və həlqə sakit dolsun */
function bars(){
  D.querySelectorAll("#v3-home [style*='width:'][style*='%']").forEach(function(el){
    if(el.dataset.dqspB||el.children.length||el.offsetHeight>14||!el.parentElement)return;
    var w=el.style.width;el.dataset.dqspB=1;el.classList.add("dqsp-fill");el.style.width="0";
    var o=new IntersectionObserver(function(es){if(es[0].isIntersecting){o.disconnect();setTimeout(function(){el.style.width=w},120)}},{threshold:.4});
    o.observe(el);
  })}
setInterval(bars,2500);
if(D.readyState!=="loading")boot();else D.addEventListener("DOMContentLoaded",boot);
})();
</script>
